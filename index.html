<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digit Rush</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="hud">
      <div class="hud-block">
        <span class="hud-label">Score</span>
        <span id="score" class="hud-value">0</span>
      </div>
      <div class="hud-title">
        <h1>Digit Rush</h1>
        <p id="status">Copy the number. Speed and accuracy score points.</p>
      </div>
    </header>

    <main class="board">
      <section class="pane pane-left" aria-label="Number to copy">
        <div class="pane-meta">
          <span>Target</span>
          <span id="length-label">10 digits</span>
        </div>
        <p id="target" class="target-number"></p>
        <div class="progress-wrap" aria-hidden="true">
          <div id="length-progress" class="progress-bar"></div>
        </div>
      </section>

      <section class="pane pane-right" aria-label="Entry keypad">
        <input
          id="entry"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          spellcheck="false"
          maxlength="200"
          placeholder="Type the number"
          aria-label="Number entry"
        >
        <div class="keypad" id="keypad">
          <button type="button" class="key" data-key="1">1</button>
          <button type="button" class="key" data-key="2">2</button>
          <button type="button" class="key" data-key="3">3</button>
          <button type="button" class="key" data-key="4">4</button>
          <button type="button" class="key" data-key="5">5</button>
          <button type="button" class="key" data-key="6">6</button>
          <button type="button" class="key" data-key="7">7</button>
          <button type="button" class="key" data-key="8">8</button>
          <button type="button" class="key" data-key="9">9</button>
          <button type="button" class="key key-util" data-action="delete">Delete</button>
          <button type="button" class="key" data-key="0">0</button>
          <button type="button" class="key key-submit" data-action="submit">Submit</button>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
